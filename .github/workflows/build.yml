name: build

# Build on every push (and pull request). Produces a single statically linked
# musl binary via an Alpine container (whose native libc is musl).
#
# On the default branch the freshly built artifact is pushed to a rolling
# release (tag `latest`) so there is always a stable, anonymous download link
# to the latest commit, without publishing a versioned release.
on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: build (musl-amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # musl, statically linked (Alpine's gcc produces musl binaries and the
      # Makefile's default -static applies).
      - name: Build (musl static, Alpine container)
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            alpine:3.20 \
            sh -c 'apk add --no-cache build-base linux-headers perl && make'

      - name: Smoke test
        run: |
          file ./build/cwg
          ./build/cwg --version
          if ldd ./build/cwg >/dev/null 2>&1; then
            echo "ERROR: build/cwg is not statically linked" >&2
            exit 1
          fi
          echo "smoke test OK"

      - name: Package
        run: |
          set -euo pipefail
          staged="$(mktemp -d)"
          cp build/cwg "$staged/cwg"
          cp LICENSE "$staged/LICENSE"
          mkdir -p dist
          tar -C "$staged" -czf "dist/cwg-linux-amd64.tar.gz" cwg LICENSE
          rm -rf "$staged"
          ls -l dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-musl-amd64
          path: dist/
          if-no-files-found: error

  rolling:
    name: Update rolling release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag="latest"
          gh release delete "$tag" --repo "$repo" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" --repo "$repo" artifacts/*.tar.gz \
            --title "latest" \
            --notes "" \
            --target "$GITHUB_SHA"
          gh release view "$tag" --repo "$repo" --json tagName,url
